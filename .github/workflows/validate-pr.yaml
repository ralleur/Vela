name: "Validate PR 🧹"

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches: [ kurtz, main ]

jobs:
  build:
    name: "Validate PR 🧹"
    if: github.event.pull_request.draft == false
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate localization changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import PurePosixPath
          import subprocess
          import sys

          changed_files = subprocess.check_output([
              "git", "diff", "--name-only", "--no-renames", "-z",
              f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}", "--",
          ]).split(b"\0")
          blocked_files = [
              os.fsdecode(path) for path in changed_files if path and PurePosixPath(os.fsdecode(path)).name not in {"Kurtz.strings", "Vela.strings"} and any(
                  part.endswith(".lproj") and part != "en.lproj"
                  for part in PurePosixPath(os.fsdecode(path)).parts[:-1]
              )
          ]

          if blocked_files:
              print("::error::Only upstream en.lproj and Kurtz.strings localization files may be changed. "
                    "Submit other translations through Weblate.")
              for path in blocked_files:
                  print(f"  {path!r}")
              sys.exit(1)

          print("Localization changes are limited to upstream en.lproj and Kurtz.strings.")
          PY

      - name: Install Homebrew dependencies
        run: brew bundle --file Brewfile

      - name: Check formatting of changed Swift files
        # Preserve kurtz/upstream authorship and avoid reformatting untouched fork code.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 <<'PYTHON'
          import os
          import subprocess
          from pathlib import Path
          paths = subprocess.check_output([
              "git", "diff", "--name-only", "--diff-filter=ACMR", "-z",
              f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}", "--", "*.swift"
          ]).split(b"\0")
          paths = [os.fsdecode(p) for p in paths if p and Path(os.fsdecode(p)).is_file()]
          if paths:
              subprocess.run(["swiftformat", *paths, "--lint", "--config", ".swiftformat",
                              "--header", "ignore"], check=True)
          PYTHON

      - name: Run SwiftLint
        run: swiftlint lint --strict --config ".swiftlint.yml"

      - name: Find Unused Strings
        run: swift Scripts/Translations/FindUnusedStrings.swift
